services:
  orders-db:
    image: postgres:16
    container_name: orders-db
    environment:
      POSTGRES_DB: orders_db
      POSTGRES_USER: orders_user
      POSTGRES_PASSWORD: orders_pass
    volumes:
      - orders_db_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    networks:
      - orders_db_network
      - store_front_network

  orders-service:
    build: .
    container_name: orders-service
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8002:8000"
    environment:
      DB_NAME: orders_db
      DB_USER: orders_user
      DB_PASSWORD: orders_pass
      DB_HOST: orders-db
      DB_PORT: 5432
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672/
    depends_on:
      - orders-db
    labels:
      - traefik.enable=true
      - traefik.http.routers.order.rule=Host(`order.localhost`)
      - traefik.http.services.order.loadbalancer.server.port=8000
      - "traefik.docker.network=store_front_network"
      - "traefik.http.routers.order.entrypoints=web"
    networks:
      - orders_db_network
      - store_front_network

volumes:
  orders_db_data:

networks:
  orders_db_network:
    driver: bridge
  store_front_network:
    external: true
