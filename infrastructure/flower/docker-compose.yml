services:
  flower:
    image: mher/flower:2.0.1
    container_name: flower
    command: celery flower --port=5555 --broker=redis://global-redis:6379/0

    ports:
      - "5555:5555"
    networks:
      - store_front_network
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://global-redis:6379/0}
      FLOWER_UNAUTHENTICATED_API: "true"

networks:
  store_front_network:
    external: true

volumes: {}
